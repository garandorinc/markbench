attacks:
  - name: none
    variants:
      - {}

  - name: inpainting_untargeted
    variants:
      - mode: inpaint
        min_mask_side_ratio: 0.18
        max_mask_side_ratio: 0.35
      - mode: inpaint
        min_mask_side_ratio: 0.22
        max_mask_side_ratio: 0.5
    guidance_scale: 7.5
    num_inference_steps: 25

  - name: inpainting_targeted
    variants:
      - mode: inpaint
        max_mask_side_ratio: 0.35
      - mode: inpaint
        max_mask_side_ratio: 0.5
    target_mask_dilation_ratio: 0.03
    guidance_scale: 7.5
    num_inference_steps: 25

  - name: splicing_untargeted
    variants:
      - mask_mode: box
        num_splices: 1
    donor_source: same_dataset_random

  - name: splicing_targeted
    variants:
      - {}
    donor_source: same_dataset_random
