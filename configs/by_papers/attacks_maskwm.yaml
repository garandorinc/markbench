# Attack configuration for MaskWM paper (2504.12739v3)
# https://arxiv.org/abs/2504.12739
#
attacks:
  # Identity (baseline)
  - name: none

  # ===== EVALUATION/TESTING =====

  # JPEG Compression - Quality factor 60 (evaluation)
  - name: jpeg
    quality: 60

  # Gaussian Blur - Kernel size 1, Sigma 3
  # Note: Kernel size 1 is unusual, using minimum kernel size 3
  - name: gaussian_blur
    kernel_size: 3
    sigma: 3.0

  # Gaussian Noise - Mean 0, Std 0.05 (scaled to [0-255])
  - name: gaussian_noise
    std: 12.75  # 0.05 * 255

  # Median Filter - Kernel size 3
  - name: median_filter
    ksize: 3

  # Salt & Pepper Noise - Ratio 0.05
  - name: salt_pepper
    amount: 0.05

  # Resize - Scaling factor 0.5
  - name: interpolation
    fx: 0.5
    fy: 0.5
    interpolation_mode: linear

  # Brightness Adjustment - Range [0.7, 1.3]
  - name: brightness
    factor: [0.7, 1.3]

  # Contrast Adjustment - Range [0.7, 1.3]
  - name: contrast
    factor: [0.7, 1.3]

  # Saturation Adjustment - Range [0.7, 1.3]
  - name: saturation
    saturation: [0.7, 1.3]

  # Hue Adjustment - Range [-0.1, 0.1]
  # Note: Using color_jiggle with only hue parameter
  - name: color_jiggle
    brightness: 0.0
    contrast: 0.0
    saturation: 0.0
    hue: [-0.1, 0.1]

  # Rotation - Angle sampled from [-30°, 30°]
  - name: rotation
    angle: [-30, 30]

  # Perspective - Distortion scale sampled from [0.1, 0.3]
  - name: perspective
    distortion_scale: [0.1, 0.3]

  # Horizontal Flip
  - name: flip
    axis: x

  # ===== TRAINING =====

  # JPEG Compression - Quality factor 50 (training)
  - name: jpeg
    quality: 50

  # Gaussian Blur - Kernel size 1, Sigma 5 (training)
  # Note: Kernel size 1 is unusual, using minimum kernel size 3
  - name: gaussian_blur
    kernel_size: 3
    sigma: 5.0

  # Gaussian Noise - Std 0.1 (training, scaled to [0-255])
  - name: gaussian_noise
    std: 25.5  # 0.1 * 255

  # Median Filter - Kernel size 5 (training)
  - name: median_filter
    ksize: 5

  # Salt & Pepper Noise - Ratio 0.1 (training)
  - name: salt_pepper
    amount: 0.1

  # Rotation - Angle sampled from [-90°, 90°] (training)
  - name: rotation
    angle: [-90, 90]

  # Perspective - Distortion scale sampled from [0.1, 0.5] (training)
  - name: perspective
    distortion_scale: [0.1, 0.5]

# Notes:
# - Paper uses different parameters for training vs evaluation
# - Paper evaluates performance across different watermarked area percentages (10%-95%)
# - Gaussian blur kernel size 1 is unusual, using kernel size 3 as minimum
